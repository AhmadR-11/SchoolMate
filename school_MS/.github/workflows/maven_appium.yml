name: SchoolMate CI - Appium Tests

on:
  push:
    branches: [ application, test ]
  pull_request:
    branches: [ application ]

jobs:
  build-and-test:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter APK
        run: |
          # Build APK so it's available for Appium
          flutter pub get
          flutter build apk --debug

      - name: Install Appium & Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium Server
        run: |
          appium &
          sleep 5

      - name: Run Appium Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          script: |
            echo "Starting Appium Tests..."
            cd appium_tests
            mvn test
